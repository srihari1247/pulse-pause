<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>PulsePause | Camera-Based Wellness & Focus Companion</title>
    <meta name="description" content="PulsePause is a camera-based human-sensing wellness and focus companion powered by Presage SmartSpectra SDK." />
    <meta property="og:title" content="PulsePause | Camera-Based Wellness & Focus Companion" />
    <meta property="og:description" content="Camera-based human-sensing wellness and focus companion powered by Presage SmartSpectra SDK." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA & Mobile Web Capabilities -->
    <meta name="theme-color" content="#070b14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PulsePause" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Diagnostics & Error Capture -->
    <script>
      window.addEventListener('error', function(event) {
        var root = document.getElementById('root');
        if (root && (!root.children || root.children.length === 0)) {
          root.innerHTML = '<div style="background:#0f172a;color:#ef4444;padding:2rem;margin:2rem;border-radius:12px;border:1px solid rgba(239,68,68,0.4);font-family:sans-serif;max-width:600px;">' +
            '<h2 style="margin-top:0;font-size:1.25rem;">Application Startup Exception</h2>' +
            '<p style="color:#94a3b8;font-size:0.9rem;">' + (event.message || 'Script execution error') + '</p>' +
            '<pre style="background:#070b14;color:#fca5a5;padding:10px;border-radius:6px;font-size:0.8rem;overflow-x:auto;">' + (event.filename || 'module') + ':' + (event.lineno || 0) + '</pre>' +
            '<button onclick="location.reload()" style="background:#0284c7;color:white;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:600;margin-top:1rem;">Reload Application</button>' +
            '</div>';
        }
      });
      window.addEventListener('unhandledrejection', function(event) {
        var root = document.getElementById('root');
        if (root && (!root.children || root.children.length === 0)) {
          var msg = event.reason ? (event.reason.message || String(event.reason)) : 'Unhandled rejection';
          root.innerHTML = '<div style="background:#0f172a;color:#ef4444;padding:2rem;margin:2rem;border-radius:12px;border:1px solid rgba(239,68,68,0.4);font-family:sans-serif;max-width:600px;">' +
            '<h2 style="margin-top:0;font-size:1.25rem;">Startup Promise Exception</h2>' +
            '<p style="color:#94a3b8;font-size:0.9rem;">' + msg + '</p>' +
            '<button onclick="location.reload()" style="background:#0284c7;color:white;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:600;margin-top:1rem;">Reload Application</button>' +
            '</div>';
        }
      });
    </script>
  </head>
  <body class="bg-[#070b14] text-slate-100 antialiased selection:bg-sky-500/30 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
