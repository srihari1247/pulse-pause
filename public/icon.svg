<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#070b14" />
      <stop offset="50%" stopColor="#0a0f1d" />
      <stop offset="100%" stopColor="#05080f" />
    </linearGradient>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="50%" stopColor="#818cf8" />
      <stop offset="100%" stopColor="#a855f7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#22d3ee" stopOpacity="0.8" />
      <stop offset="100%" stopColor="#a855f7" stopOpacity="0.4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Ambient Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="8" opacity="0.6" />

  <!-- Glowing Active Cyan/Violet Arc -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#arcGrad)" stroke-width="14" stroke-dasharray="1130" stroke-dashoffset="320" stroke-linecap="round" filter="url(#glow)" />

  <!-- Inner Breathing Luminous Sphere -->
  <circle cx="256" cy="256" r="96" fill="url(#glowGrad)" filter="url(#glow)" opacity="0.3" />
  <circle cx="256" cy="256" r="80" fill="#0f172a" stroke="#38bdf8" stroke-width="4" />

  <!-- Cardiac & Respiratory Sine Wave Dynamics -->
  <path d="M 176 256 Q 216 216, 240 256 T 272 256 Q 284 210, 296 290 T 312 256 L 336 256" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Orbiting Satellite Node -->
  <circle cx="383" cy="129" r="12" fill="#ffffff" filter="url(#glow)" />
</svg>
